minimumLimaVersion: 2.0.0

base:
  - template:_images/ubuntu
  - template:_default/mounts

user:
  shell: /usr/bin/zsh

param:
  HostDevelopmentPath: "/tmp"

ssh:
  forwardAgent: true

mounts:
  - location: "{{.Param.HostDevelopmentPath}}"
    mountPoint: "{{.Home}}/dev"
    writable: true

provision:
  - mode: system
    file:
      url: bootstrap-system.sh

  - mode: user
    file:
      url: bootstrap-user.sh
